services:
  api:
    build: .
    container_name: logistics-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboard:
    build: .
    container_name: logistics-dashboard
    command: streamlit run app/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped
